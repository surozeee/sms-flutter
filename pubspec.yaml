name: campaign_connect
description: CampaignConnect - Political Campaigning App
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  flutter_contacts: ^1.1.9
  shared_preferences: ^2.3.3
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  excel: ^4.0.6
  file_picker: ^8.1.2
  path_provider: ^2.1.5
  open_filex: ^4.5.2
  webview_flutter: ^4.10.0
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/main_logo.png" # Fallback/iOS icon
  min_sdk_android: 28 # Android 9 (Pie) minimum support

  # Adaptive Icon Config (Crucial for Android 12+)
  adaptive_icon_background: "#FFFFFF" # Your background color
  adaptive_icon_foreground: "assets/icon/main_logo.png" # Your logo only
